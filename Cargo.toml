[workspace]
resolver = "3"
members = ["ratatui-uefi", "terminput-uefi", "examples/*"]

[workspace.package]
authors = ["reuben olinsky"]
readme = "README.md"
license = "MIT"
edition = "2024"
keywords = ["tui", "uefi", "terminal"]
rust-version = "1.92.0"

[workspace.dependencies]
ratatui = { version = "0.30.2", default-features = false }
ratatui-uefi = { path = "ratatui-uefi" }
terminput = { version = "0.5.14", default-features = false }
terminput-uefi = { path = "terminput-uefi" }
uefi = { version = "0.38.0", features = ["alloc"] }
